# cargo-deny configuration: licenses, security advisories, banned crates and
# allowed sources. See docs/DEPENDENCIES.md for the policy behind it.

[graph]
# Ferrufus only ships for Linux.
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails
# the check unless it is explicitly ignored here with a reason.
yanked = "deny"
ignore = [
    # zbus 5.x helper crates, unmaintained as standalone crates since zbus 6
    # absorbed them. They are only used by AccessKit's AT-SPI bridge (screen
    # reader support in the GUI) through eframe 0.37. No vulnerability is
    # reported; remove these once eframe moves to an AccessKit using zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: AccessKit AT-SPI bridge via eframe; unmaintained, not vulnerable" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: AccessKit AT-SPI bridge via eframe; unmaintained, not vulnerable" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: AccessKit AT-SPI bridge via eframe; unmaintained, not vulnerable" },
]

[licenses]
# Licenses compatible with distributing Ferrufus under GPL-3.0-or-later.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates are not published; their license is the project license.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies between unpublished workspace crates.
allow-wildcard-paths = true
# Crates that wrap C libraries. Pure-Rust alternatives must be used instead.
deny = [
    { name = "openssl-sys", reason = "C library; use a pure-Rust TLS stack" },
    { name = "openssl", reason = "C library; use a pure-Rust TLS stack" },
    { name = "libz-sys", reason = "C library; use miniz_oxide through flate2" },
    { name = "zstd-sys", reason = "C library; use ruzstd" },
    { name = "lzma-sys", reason = "C library; use lzma-rs" },
    { name = "bzip2-sys", reason = "C library; use the Rust bzip2 backend" },
    { name = "libudev-sys", reason = "C library; read sysfs and the udev database directly" },
    { name = "aws-lc-sys", reason = "C library" },
    { name = "gtk-sys", reason = "C library; use the XDG desktop portal" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
